<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Sipper Bottle | The Design Factory</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-gold: #8B735B;
            --color-bg-soft: #FAF9F6;
            --color-text: #2D2D2D;
            --color-text-light: #707070;
            --color-white: #ffffff;
            --font-primary: 'Cormorant Garamond', serif;
            --font-secondary: 'Montserrat', sans-serif;
            --transition-smooth: all 0.6s cubic-bezier(0.2, 1, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-secondary); color: var(--color-text); background-color: var(--color-white); overflow-x: hidden; }

        header { padding: 20px 4%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; }
        .logo img { height: 50px; }

        .product-page { display: flex; min-height: 100vh; }
        .gallery-section { flex: 1.2; background-color: var(--color-bg-soft); overflow-y: auto; scrollbar-width: none; }
        .gallery-section img { width: 100%; height: auto; display: block; }

        .details-section { flex: 0.8; padding: 80px 6%; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .product-title { font-family: var(--font-primary); font-size: 38px; margin-bottom: 15px; color: var(--color-text); font-weight: 400; }
        .product-price { font-size: 20px; color: var(--color-gold); margin-bottom: 40px; font-weight: 500; }

        .option-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; color: var(--color-text-light); margin-bottom: 15px; display: block; }
        .input-field { width: 100%; padding: 15px; border: 1px solid #eee; margin-bottom: 25px; outline: none; font-size: 14px; }

        .btn-add { width: 100%; padding: 20px; background: var(--color-text); color: white; border: none; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: var(--color-gold); }

        .why-us-minimal { margin-top: 60px; padding-top: 40px; border-top: 1px solid #eee; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .why-item { display: flex; align-items: center; gap: 15px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
        .why-item svg { width: 22px; height: 22px; stroke: #FBC9BC; }

        @media (max-width: 1024px) { .product-page { flex-direction: column; } .details-section { position: static; height: auto; } }
    </style>
</head>
<body>

    <header>
        <a href="mockup.html" class="logo"><img src="logo.jpeg" alt="The Design Factory"></a>
        <div class="nav-right">
            <a href="cart.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg></a>
        </div>
    </header>

    <main class="product-page">
        <section class="gallery-section">
            <img src="category_school.png" alt="Sipper Bottle">
            <img src="category_bags.png" alt="Lifestyle Context">
        </section>

        <section class="details-section">
            <h1 class="product-title">Insulated Personalized Sipper Bottle</h1>
            <div class="product-price">₹ 850.00</div>

            <div class="options-section">
                <span class="option-label">Enter Name</span>
                <input type="text" class="input-field" placeholder="e.g. Kabir">

                <span class="option-label">Select Color</span>
                <select class="input-field">
                    <option>Royal Blue</option>
                    <option>Blush Pink</option>
                    <option>Mint Green</option>
                </select>
            </div>

            <button class="btn-add" onclick="window.location.href='cart.html'">Add to Shopping Bag</button>

            <div class="why-us-minimal">
                <div class="why-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span>BPA Free</span>
                </div>
                <div class="why-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                    <span>Stainless Steel</span>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
