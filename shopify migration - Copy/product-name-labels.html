<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Name Labels | The Design Factory</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-gold: #8B735B;
            --color-gold-light: #FCD589;
            --color-blue: #d7e4e4;
            --color-peach: #FBC9BC;
            --color-bg-soft: #FAF9F6;
            --color-text: #2D2D2D;
            --color-text-light: #707070;
            --color-white: #ffffff;
            --font-primary: 'Cormorant Garamond', serif;
            --font-secondary: 'Montserrat', sans-serif;
            --transition-smooth: all 0.6s cubic-bezier(0.2, 1, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-secondary); color: var(--color-text); background-color: var(--color-white); overflow-x: hidden; }

        /* --- Announcement Bar --- */
        .announcement-bar { background-color: var(--color-gold); color: white; padding: 10px 0; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; overflow: hidden; white-space: nowrap; }
        .announcement-track { display: inline-flex; animation: marquee 30s linear infinite; }
        .announcement-text { padding-right: 50px; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- Header --- */
        header { padding: 20px 4%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; }
        .logo img { height: 50px; }
        .nav-right { display: flex; gap: 20px; align-items: center; }

        /* --- Product Layout --- */
        .product-page { display: flex; min-height: 100vh; }

        .gallery-section { flex: 1.2; background-color: var(--color-bg-soft); position: relative; overflow-y: auto; scrollbar-width: none; }
        .gallery-section::-webkit-scrollbar { display: none; }
        .gallery-section img { width: 100%; height: auto; display: block; }

        .details-section { flex: 0.8; padding: 80px 6%; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .product-title { font-family: var(--font-primary); font-size: 38px; margin-bottom: 15px; color: var(--color-text); font-weight: 400; line-height: 1.2; }
        .product-price { font-size: 20px; color: var(--color-gold); margin-bottom: 40px; font-weight: 500; }

        .options-section { margin-bottom: 40px; }
        .option-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; color: var(--color-text-light); margin-bottom: 15px; display: block; }
        
        .input-field { width: 100%; padding: 15px; border: 1px solid #eee; margin-bottom: 25px; outline: none; font-size: 14px; }
        .input-field:focus { border-color: var(--color-gold); }

        .set-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 30px; }
        .set-btn { padding: 15px; border: 1px solid #eee; background: #fff; cursor: pointer; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; }
        .set-btn.active { border-color: var(--color-gold); background: var(--color-bg-soft); }

        .buy-actions { display: flex; flex-direction: column; gap: 15px; }
        .btn-add { padding: 20px; background: var(--color-text); color: white; border: none; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-add:hover { background: var(--color-gold); }

        .why-us-minimal { margin-top: 60px; padding-top: 40px; border-top: 1px solid #eee; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .why-item { display: flex; align-items: center; gap: 15px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
        .why-item svg { width: 22px; height: 22px; stroke: var(--color-peach); }

        @media (max-width: 1024px) { .product-page { flex-direction: column; } .details-section { position: static; height: auto; } }
    </style>
</head>
<body>

    <div class="announcement-bar">
        <div class="announcement-track">
            <span class="announcement-text">ELEVATE YOUR SCHOOL GEAR &bull; PERSONALIZED WITH LOVE &bull; WORLDWIDE SHIPPING &bull; </span>
            <span class="announcement-text">ELEVATE YOUR SCHOOL GEAR &bull; PERSONALIZED WITH LOVE &bull; WORLDWIDE SHIPPING &bull; </span>
        </div>
    </div>

    <header>
        <a href="mockup.html" class="logo"><img src="logo.jpeg" alt="The Design Factory"></a>
        <div class="nav-right">
            <a href="cart.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg></a>
        </div>
    </header>

    <main class="product-page">
        <section class="gallery-section">
            <img src="category_labels.png" alt="Name Labels">
            <img src="category_school.png" alt="Name Labels Context">
        </section>

        <section class="details-section">
            <h1 class="product-title">Premium Waterproof Name Labels</h1>
            <div class="product-price">₹ 450.00</div>

            <div class="options-section">
                <span class="option-label">Enter Name</span>
                <input type="text" class="input-field" placeholder="e.g. Aaryan Khanna">

                <span class="option-label">Select Theme</span>
                <select class="input-field">
                    <option>Dino Adventure</option>
                    <option>Unicorn Magic</option>
                    <option>Space Explorer</option>
                    <option>Floral Bloom</option>
                </select>

                <span class="option-label">Select Quantity</span>
                <div class="set-grid">
                    <button class="set-btn active">Set of 40</button>
                    <button class="set-btn">Set of 80</button>
                    <button class="set-btn">Set of 120</button>
                    <button class="set-btn">Set of 200</button>
                </div>
            </div>

            <div class="buy-actions">
                <button class="btn-add" onclick="window.location.href='cart.html'">Add to Shopping Bag</button>
            </div>

            <div class="why-us-minimal">
                <div class="why-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>Waterproof</span>
                </div>
                <div class="why-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Personalized</span>
                </div>
                <div class="why-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                    <span>Non-Tearable</span>
                </div>
                <div class="why-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <span>Strong Adhesive</span>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
