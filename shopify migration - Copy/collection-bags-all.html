<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Bags | The Design Factory</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@200;300;400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-gold: #BFA37E;
            --color-gold-light: #FCD589;
            --color-bg-soft: #FAF9F6;
            --color-text: #2D2D2D;
            --color-text-light: #707070;
            --color-white: #ffffff;
            --font-primary: 'Cormorant Garamond', serif;
            --font-secondary: 'Montserrat', sans-serif;
            --font-accent: 'Cinzel', serif;
            --transition-smooth: all 0.6s cubic-bezier(0.2, 1, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-secondary); color: var(--color-text); background-color: var(--color-white); overflow-x: hidden; }

        header { padding: 20px 4%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; background: #fff; position: sticky; top: 0; z-index: 100; }
        .logo img { height: 50px; }
        .nav-right { display: flex; gap: 20px; align-items: center; }

        .all-hero { 
            padding: 100px 4% 80px; 
            text-align: center; 
            background: #FAF9F6; 
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 60px;
        }

        .breadcrumbs {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--color-gold);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .all-hero h1 { 
            font-family: var(--font-primary); 
            font-size: 64px; 
            color: #2D2D2D; 
            margin-bottom: 20px; 
            font-weight: 400; 
            letter-spacing: 4px; 
            text-transform: capitalize; 
        }

        .gold-divider {
            width: 60px;
            height: 2px;
            background: var(--color-gold);
            margin: 0 auto 30px;
        }

        .all-hero p { 
            font-family: var(--font-secondary); 
            font-size: 15px; 
            color: var(--color-text-light); 
            max-width: 700px; 
            margin: 0 auto; 
            line-height: 1.8; 
            letter-spacing: 1px; 
            font-weight: 300;
        }


        .collection-all-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; padding: 0 4% 80px; max-width: 1400px; margin: 0 auto; }
        
        .sub-cat-card { position: relative; border-radius: 15px; overflow: hidden; background: #f8f8f8; aspect-ratio: 1.8 / 1; text-decoration: none; display: block; }
        .sub-cat-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s ease; }
        .sub-cat-card:hover img { transform: scale(1.05); }

        .sub-cat-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 5; }
        
        .shop-now-btn { background: #fff; color: #333; padding: 12px 30px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .sub-cat-badge { font-family: var(--font-primary); background: #fff; color: #333; padding: 15px 40px; border-radius: 10px; font-size: 18px; font-weight: 500; letter-spacing: 2px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-transform: uppercase; }

        @media (max-width: 900px) {
            .collection-all-grid { grid-template-columns: 1fr; }
            .all-hero h1 { font-size: 48px; }
            .trust-badges { gap: 20px; }
            .badge-circle { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></div>
        <a href="mockup.html" class="logo"><img src="logo.jpeg" alt="The Design Factory"></a>
        <div class="nav-right">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <a href="cart.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg></a>
        </div>
    </header>

    <div class="all-hero">
        <div class="breadcrumbs">Home / Bags</div>
        <h1>Bags</h1>
        <div class="gold-divider"></div>
        <p>Discover our wide collection of handcrafted bags. Designed with love and meticulous attention to detail, our range offers the perfect blend of functionality and boutique elegance for every day.</p>
    </div>

    <main class="collection-all-grid">
        <!-- Waist Bags -->
        <a href="collection-bags.html" class="sub-cat-card">
            <img src="https://cdn.shopify.com/s/files/1/0750/4694/5085/files/IMG_4284.PNG?v=1778575001" alt="Waist Bags">
            <div class="sub-cat-overlay">
                <div class="shop-now-btn">SHOP NOW</div>
                <div class="sub-cat-badge">WAIST BAGS</div>
            </div>
        </a>

        <!-- Tote Bags -->
        <a href="collection-bags.html" class="sub-cat-card">
            <img src="category_bags.png" alt="Tote Bags">
            <div class="sub-cat-overlay">
                <div class="shop-now-btn">SHOP NOW</div>
                <div class="sub-cat-badge">TOTE BAGS</div>
            </div>
        </a>

        <!-- Backpacks -->
        <a href="collection-bags.html" class="sub-cat-card">
            <img src="https://cdn.shopify.com/s/files/1/0750/4694/5085/files/IMG_3978.jpg?v=1778573386" alt="Backpacks">
            <div class="sub-cat-overlay">
                <div class="shop-now-btn">SHOP NOW</div>
                <div class="sub-cat-badge">BACKPACKS</div>
            </div>
        </a>

        <!-- Jelly Totes -->
        <a href="collection-bags.html" class="sub-cat-card">
            <img src="https://cdn.shopify.com/s/files/1/0750/4694/5085/files/IMG_4055.webp?v=1778573655" alt="Jelly Totes">
            <div class="sub-cat-overlay">
                <div class="shop-now-btn">SHOP NOW</div>
                <div class="sub-cat-badge">JELLY TOTES</div>
            </div>
        </a>
    </main>

</body>
</html>
