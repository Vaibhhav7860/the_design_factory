# cloudbuild.yaml — CI/CD pipeline for The Design Factory
# Triggered on push to main branch
# Builds in asia-south1 to stay co-located with Cloud Run + MongoDB Atlas

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_RAZORPAY_KEY_ID=${_NEXT_PUBLIC_RAZORPAY_KEY_ID}'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/tdf-docker/tdf-web:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/tdf-docker/tdf-web:latest'
      - '.'

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/tdf-docker/tdf-web'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tdf-web'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/tdf-docker/tdf-web:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'

substitutions:
  _NEXT_PUBLIC_RAZORPAY_KEY_ID: 'rzp_test_Svb0m9gO8fYlgr'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
